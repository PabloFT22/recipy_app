# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   brew install postgresql
#
# Configure Using Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  <% if ENV["DB_USERNAME"].present? %>
  username: <%= ENV["DB_USERNAME"] %>
  <% end %>
  <% if ENV["DB_PASSWORD"].present? %>
  password: <%= ENV["DB_PASSWORD"] %>
  <% end %>

development:
  <<: *default
  database: recipy_app_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: recipy_app_test

# In production the connection comes entirely from DATABASE_URL, which the
# host sets for you (Fly sets it when you attach a Postgres cluster). Rails
# merges DATABASE_URL over whatever is written here, so keep this minimal
# and never put credentials in this file.
production:
  <<: *default
  database: recipy_app_production
