test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Production object storage. Any S3-compatible provider works — Tigris (Fly's
# built-in, `fly storage create`), Cloudflare R2, Backblaze B2, or real S3 —
# because they all speak the same API. Set the five env vars below and nothing
# here changes between them.
#
# This MUST be used in production: the container filesystem is ephemeral, so
# recipe photos written to disk disappear on every deploy.
s3:
  service: S3
  access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("AWS_REGION", "auto") %>
  bucket: <%= ENV["AWS_BUCKET"] %>
  endpoint: <%= ENV["AWS_ENDPOINT_URL_S3"] %>
  force_path_style: true
